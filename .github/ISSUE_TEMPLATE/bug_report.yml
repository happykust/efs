name: Ошибка
description: Сообщить о некорректной работе efs
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло
      description: Опишите проблему и чего вы ожидали вместо этого.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести
      description: Команда efs целиком и, если возможно, минимальный SBOM-файл или конфиг.
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Вывод команды
      description: Полный вывод, включая traceback. Запустите с флагом -v для подробностей.
      render: shell

  - type: input
    id: version
    attributes:
      label: Версия efs
      description: "Вывод команды: pip show efs-sbom"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Версия Python и ОС
      placeholder: "3.12.7, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: scanner
    attributes:
      label: Инструмент генерации SBOM
      description: Если проблема связана со сканированием — cdxgen или trivy и его версия.
