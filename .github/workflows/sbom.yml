name: SBOM

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-sbom:
    name: SBOM самого efs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g @cyclonedx/cdxgen
      - run: uv sync --locked
      - name: Генерация и постобработка SBOM
        run: |
          uv run efs scan --tool cdxgen --target . --output bom.raw.json
          uv run efs postprocess bom.raw.json efs.sbom.json \
            --app-name efs \
            --app-version "${GITHUB_REF_NAME#v}" \
            --manufacturer "Kirill Nikolaevskiy"
      - name: Валидация результата
        run: |
          uv run efs check efs.sbom.json || status=$?
          if [ "${status:-0}" = "1" ]; then
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: efs-sbom
          path: efs.sbom.json
