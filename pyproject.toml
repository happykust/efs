[project]
name = "sbom-utils"
version = "1.0.0"
description = "Проверка и обработка SBOM-файлов в формате CycloneDX JSON"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.22.0",
    "odfpy>=1.4.1",
    "platformdirs>=4.9.4",
    "referencing>=0.35.0",
    "requests>=2.32.5",
    "rfc3339-validator>=0.1.4",
    "rfc3987>=1.3.8",
    "typer>=0.12",
    "questionary>=2.0",
]

[project.scripts]
sbom = "sbom_utils.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sbom_utils"]
