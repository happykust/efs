[project]
name = "sbom-utils"
version = "1.0.0"
description = "Проверка и обработка SBOM-файлов в формате CycloneDX JSON"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.22.0",
    "odfpy>=1.4.1",
    "platformdirs>=4.9.4",
    "referencing>=0.35.0",
    "requests>=2.32.5",
    "rfc3339-validator>=0.1.4",
    "rfc3987>=1.3.8",
]

[project.scripts]
sbom-checker = "sbom_utils.checker:main"
sbom-to-csv = "sbom_utils.to_csv:main"
sbom-to-odt = "sbom_utils.to_odt:main"
sbom-unifier = "sbom_utils.unifier:main"
sbom-updater = "sbom_utils.updater:main"
cdxgen-postprocess = "sbom_utils.cdxgen_postprocess:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sbom_utils"]

[tool.hatch.build.targets.wheel.force-include]
"sbom_utils/additional_schemas" = "sbom_utils/additional_schemas"
"sbom_utils/schemas" = "sbom_utils/schemas"
"sbom_utils/odt_templates" = "sbom_utils/odt_templates"
"sbom_utils/purl_to_vcs.json" = "sbom_utils/purl_to_vcs.json"
