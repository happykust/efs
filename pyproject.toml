[project]
name = "efs-sbom"
version = "1.0.3"
description = "Easy FSTEC SBOMs — генерация, проверка и обогащение SBOM (CycloneDX) под требования ФСТЭК и ГОСТ Р 56939-2024"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Kirill Nikolaevskiy", email = "me@happykust.dev" },
]
maintainers = [
    { name = "Kirill Nikolaevskiy", email = "me@happykust.dev" },
]
keywords = [
    "sbom",
    "cyclonedx",
    "fstec",
    "gost",
    "supply-chain",
    "compliance",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "jsonschema>=4.22.0",
    "odfpy>=1.4.1",
    "platformdirs>=4.9.4",
    "referencing>=0.35.0",
    "requests>=2.32.5",
    "rich>=13.0",
    "rfc3339-validator>=0.1.4",
    "rfc3987>=1.3.8",
    "typer>=0.12",
    "questionary>=2.0",
]

[project.urls]
Homepage = "https://github.com/happykust/efs"
Repository = "https://github.com/happykust/efs"
Issues = "https://github.com/happykust/efs/issues"
Changelog = "https://github.com/happykust/efs/blob/main/CHANGELOG.md"

[project.scripts]
efs = "efs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["efs"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["efs"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # длину строк контролирует форматтер, а не линтер
    "B008",  # typer.Option/Argument в значениях по умолчанию — идиома typer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
